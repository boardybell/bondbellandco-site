    box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.8),0 0 40px rgba(255,62,165,.18)}
  .mech{width:min(150px,36vw);padding:18px 0 20px;border-radius:5px;display:flex;flex-direction:column;align-items:center;gap:16px;
    background:linear-gradient(#2A2A34,#1A1A22);box-shadow:inset 0 0 0 2px #3A3A48}
  .mech .price{width:68%;padding:11px 0;border-radius:4px;text-align:center;font:700 24px/1 inherit;color:#2A1300;background:var(--amber);
    box-shadow:0 0 12px var(--amber),0 0 30px rgba(255,178,56,.5),inset 0 -3px 0 rgba(0,0,0,.25);font-family:inherit}
  .mech.off .price{background:#4A3A20;color:#1A1208;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
  .mech .slot{width:15px;height:84px;border-radius:8px;background:#000;box-shadow:inset 0 0 0 2px #555,0 0 0 2px #111}
  .mech .ret{width:42px;height:22px;border-radius:2px;background:#0A0A0E;box-shadow:inset 0 0 0 2px #444}
  .door.armed .mech:not(.off) .slot{box-shadow:inset 0 0 0 2px var(--cyan),0 0 16px var(--cyan)}
  .door.hot .mech:not(.off) .price{background:#fff}
  .score{font-size:14px;letter-spacing:.24em;color:var(--muted)}
  .score b{color:var(--amber);text-shadow:0 0 10px var(--amber);font-size:22px;display:inline-block;margin-left:8px}
  .tray{position:relative;z-index:41;display:flex;gap:clamp(12px,3vw,24px);min-height:clamp(110px,30vw,160px);align-items:center}

  .coin{width:clamp(96px,27vw,140px);height:clamp(96px,27vw,140px);border-radius:50%;background:none;filter:drop-shadow(0 10px 12px rgba(0,0,0,.7)) drop-shadow(0 0 10px rgba(220,230,255,.25));
    animation:bob 3s ease-in-out infinite}
  .coin svg{display:block;width:100%;height:100%;pointer-events:none}
  .coin:nth-child(2){animation-delay:-1s}.coin:nth-child(3){animation-delay:-2s}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .coin:hover{animation-play-state:paused;filter:drop-shadow(0 10px 12px rgba(0,0,0,.7)) drop-shadow(0 0 12px var(--cyan))}
  .coin.dragging{animation:spin .9s linear infinite;filter:drop-shadow(0 0 16px var(--pink))}
  @keyframes spin{to{transform:rotateY(360deg)}}
