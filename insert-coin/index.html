<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insert Coin | Bond Bell &amp; Co</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="base.css?v=1">
<style>
  /* Option 2 · Night Arcade: a 1980s cabinet coin door, neon and CRT glow. */
  :root{--bg:#05030C;--pink:#FF3EA5;--cyan:#38E8FF;--amber:#FFB238;--text:#F2ECFF;--muted:#9C90C0}
  body{background:var(--bg);color:var(--text);font-family:ui-monospace,'SF Mono',Menlo,monospace}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 50%,transparent 60%,rgba(0,0,0,.7))}
  body::after{content:"";position:fixed;left:-10%;right:-10%;bottom:0;height:42vh;z-index:0;pointer-events:none;
    background:linear-gradient(transparent 0,rgba(255,62,165,.25) 100%),repeating-linear-gradient(90deg,rgba(56,232,255,.35) 0 1px,transparent 1px 60px),
    repeating-linear-gradient(0deg,rgba(56,232,255,.35) 0 1px,transparent 1px 34px);transform:perspective(300px) rotateX(55deg);transform-origin:bottom}
  .sound{color:var(--muted);font-family:inherit}
  .wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px 16px}
  .brand img{filter:drop-shadow(0 0 6px rgba(56,232,255,.8)) drop-shadow(0 0 18px rgba(56,232,255,.4))}
  h1{margin:0;font:700 clamp(30px,8vw,56px)/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#fff;
    text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 28px var(--pink),0 0 48px var(--pink);animation:flick 4s infinite}
  @keyframes flick{0%,92%,96%,100%{opacity:1}94%{opacity:.55}}
  .hint{margin:-8px 0 0;color:var(--cyan);font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 8px rgba(56,232,255,.7);animation:blink 1.1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  /* coin door: two coin mechs like a real cabinet, the left one live */
  .door{display:flex;gap:18px;padding:22px;border-radius:6px;background:linear-gradient(#1A1A22,#0C0C12);border:2px solid #2C2C38;
    box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.8),0 0 40px rgba(255,62,165,.18)}
  .mech{width:110px;padding:14px 0 16px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:12px;
    background:linear-gradient(#2A2A34,#1A1A22);box-shadow:inset 0 0 0 2px #3A3A48}
  .mech .price{width:74px;padding:8px 0;border-radius:3px;text-align:center;font:700 18px/1 inherit;color:#2A1300;background:var(--amber);
    box-shadow:0 0 12px var(--amber),0 0 30px rgba(255,178,56,.5),inset 0 -3px 0 rgba(0,0,0,.25);font-family:inherit}
  .mech.off .price{background:#4A3A20;color:#1A1208;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
  .mech .slot{width:10px;height:44px;border-radius:5px;background:#000;box-shadow:inset 0 0 0 2px #555,0 0 0 2px #111}
  .mech .ret{width:30px;height:16px;border-radius:2px;background:#0A0A0E;box-shadow:inset 0 0 0 2px #444}
  .door.armed .mech:not(.off) .slot{box-shadow:inset 0 0 0 2px var(--cyan),0 0 16px var(--cyan)}
  .door.hot .mech:not(.off) .price{background:#fff}
  .score{font-size:14px;letter-spacing:.24em;color:var(--muted)}
  .score b{color:var(--amber);text-shadow:0 0 10px var(--amber);font-size:22px;display:inline-block;margin-left:8px}
  .tray{position:relative;z-index:41;display:flex;gap:18px;min-height:110px;align-items:center}
  /* arcade token: reeded gold edge, sunken field, raised lettering, a moving sheen and a neon rim */
  .coin{width:96px;height:96px;border-radius:50%;padding:5px;
    background:repeating-conic-gradient(#8A5E00 0 4deg,#FFD24A 4deg 8deg);
    box-shadow:0 0 0 2px #5A3E00,0 0 18px rgba(255,210,74,.45),0 10px 18px rgba(0,0,0,.6);animation:bob 3s ease-in-out infinite}
  .coin:nth-child(2){animation-delay:-1s}.coin:nth-child(3){animation-delay:-2s}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .coin .face{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle at 35% 28%,#FFF8D6 0,#FFD84E 26%,#E9A91A 62%,#9A6A06 100%);
    box-shadow:inset 0 0 0 2px #B07A08,inset 0 0 0 5px rgba(255,240,180,.55),inset 0 0 0 7px #C98E10,inset 0 -6px 12px rgba(90,62,0,.45)}
  .coin .face::before{content:"";position:absolute;inset:10px;border-radius:50%;border:1px dotted rgba(90,62,0,.55)}
  .coin .face::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);
    transform:translateX(-100%);animation:sheen 3.6s ease-in-out infinite}
  .coin:nth-child(2) .face::after{animation-delay:1.2s}.coin:nth-child(3) .face::after{animation-delay:2.4s}
  @keyframes sheen{0%,55%{transform:translateX(-100%)}80%,100%{transform:translateX(100%)}}
  /* the portrait is struck into the gold: multiply turns the paper gold and the ink a deep bronze */
  .coin img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);border-radius:50%;object-fit:cover;
    mix-blend-mode:multiply;filter:sepia(1) saturate(2) hue-rotate(-8deg) contrast(1.25);object-position:50% 30%;pointer-events:none}
  .coin b{position:absolute;z-index:1;bottom:3px;left:50%;transform:translateX(-50%);padding:2px 6px 1px;border-radius:3px;
    font:900 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.12em;color:#FFE9A8;background:#6A4300;
    box-shadow:0 0 0 1px #FFD24A,0 1px 2px rgba(0,0,0,.5)}
  .coin:hover{animation-play-state:paused;box-shadow:0 0 0 2px #5A3E00,0 0 0 4px var(--cyan),0 0 26px var(--cyan),0 10px 18px rgba(0,0,0,.6)}
  .coin.dragging{animation:spin .9s linear infinite;box-shadow:0 0 0 2px #5A3E00,0 0 0 4px var(--pink),0 0 30px var(--pink)}
  @keyframes spin{to{transform:rotateY(360deg)}}
  .start{border:2px solid var(--pink);border-radius:4px;padding:14px 30px;font:700 15px/1 inherit;font-family:inherit;letter-spacing:.3em;text-transform:uppercase;color:#fff;background:transparent;
    text-shadow:0 0 8px var(--pink);box-shadow:0 0 14px var(--pink),inset 0 0 14px rgba(255,62,165,.5)}
  .start.ready{animation:blink 1.1s steps(2,start) infinite}
</style>
</head>
<body>
<button class="sound" type="button" aria-pressed="true">Sound on</button>
<main class="wrap">
  <a class="brand" href="../" aria-label="Bond Bell &amp; Co home"><img src="../images/logo-cream.png" alt="Bond Bell &amp; Co. Private Wealth Advisors" width="1335" height="250"></a>
  <h1>Insert coin</h1>
  <p class="hint" id="hint" data-one="1 credit · Press start" data-go="Player 1 · Ready">Drag a coin into the slot</p>
  <div class="door" id="door">
    <div class="mech" id="plate"><div class="price">25¢</div><div class="slot" id="slot"></div><div class="ret"></div></div>
    <div class="mech off" aria-hidden="true"><div class="price">25¢</div><div class="slot"></div><div class="ret"></div></div>
  </div>
  <div class="score">CREDIT<b id="credit" data-pad="2">00</b></div>
  <div class="tray"><button class="coin" type="button" aria-label="Insert coin"><span class="face"><img src="face.jpg?v=2" alt="" width="240" height="240" draggable="false"><b>BBC</b></span></button><button class="coin" type="button" aria-label="Insert coin"><span class="face"><img src="face.jpg?v=2" alt="" width="240" height="240" draggable="false"><b>BBC</b></span></button><button class="coin" type="button" aria-label="Insert coin"><span class="face"><img src="face.jpg?v=2" alt="" width="240" height="240" draggable="false"><b>BBC</b></span></button></div>
  <button class="start" id="start" type="button">1P Start</button>
  <p class="sr" id="live" aria-live="polite"></p>
</main>
<div class="fade" id="fade"></div>
<script>window.COIN_THEME = { wave: 'square', credit: [880, 1760], start: [392, 523, 659, 784, 1047] };</script>
<script src="coin.js?v=1"></script>
</body>
</html>
