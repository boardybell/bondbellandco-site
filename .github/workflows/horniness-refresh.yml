# Installed by scripts/deploy.sh into the public hosting repo as .github/workflows/horniness-refresh.yml.
# Keeps /horniness-index/ current without a server: hourly, refresh the edition (cases + official publications)
# from the hosted dashboard's public read API and the daily closes from free sources, then commit only real
# changes. Every refresh is a dated commit in this repo (the record of what was published and when).
name: Horniness Index refresh
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: horniness-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh edition and prices
        env:
          HI_SITE_DIR: ${{ github.workspace }}
          HI_SOURCE_URL: ${{ secrets.HI_SOURCE_URL }}
        run: |
          node .github/horniness/snapshot.mjs
          node .github/horniness/prices.mjs || echo "price refresh failed; previous prices kept"
      - name: Commit and publish real changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add horniness-index/data.js horniness-index/prices.js
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="horniness-refresh" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Horniness Index refresh $(date -u +%FT%H:%MZ)"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null && echo "pages build requested"
